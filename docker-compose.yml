# Everything the server needs, in one file.
#
#   docker compose up -d --build
#
# Then open  http://<server-ip>/parserIICS
#
# nginx owns port 80 and forwards /parserIICS to the app, so the rest of the
# host's port 80 stays free for whatever else you serve later.

services:
  app:
    build: .
    image: iics-parser:latest
    restart: unless-stopped
    environment:
      URL_PREFIX: ${URL_PREFIX:-/parserIICS}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-6}
      # Optional - only needed for the "draft with AI" checkbox.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    volumes:
      - jobs:/data
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  jobs:
