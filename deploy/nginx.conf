upstream iics_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Export packages are a few MB, but leave room; keep this at or above
    # MAX_UPLOAD_MB or nginx rejects the upload before the app ever sees it.
    client_max_body_size 220m;

    location /parserIICS {
        proxy_pass http://iics_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Parsing a large package and rendering both documents happens inside
        # the request, so the proxy must be at least as patient as gunicorn.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    # A bare visit to the host lands on the tool rather than a 404.
    location = / {
        return 302 /parserIICS/;
    }
}
