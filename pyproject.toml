[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iics-parser"
version = "1.0.0"
description = "Parse Informatica IICS export packages into migration analysis documents (Excel + Word) for Oracle OIC modernisation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["openai>=1.40"]
dev = ["pytest>=7.4"]
web = ["Flask>=3.0", "gunicorn>=21.2"]

[project.scripts]
iics-parser = "iics_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Anything here that is not a .py file has to be listed, or pip installs the
# code without it and the failure only shows up in a container.
iics_parser = ["templates/*.docx"]
"iics_parser.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
