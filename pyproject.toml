[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iics-parser"
version = "1.0.0"
description = "Parse Informatica IICS export packages into migration analysis documents (Excel + Word) for Oracle OIC modernisation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=7.4"]

[project.scripts]
iics-parser = "iics_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iics_parser = ["templates/*.docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
